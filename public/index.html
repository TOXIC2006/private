<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Git Contributor</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <div class="glass-card">
            <h1>Git Contributor</h1>
            <p>Make a contribution directly to a GitHub repository.</p>

            <div class="stats-container">
                <div class="stat-box">
                    <h3>Contributions Today</h3>
                    <div id="daily-count" class="stat-number">0</div>
                </div>
            </div>

            <div class="input-group">
                <input type="text" id="repo-url" placeholder="e.g. https://github.com/username/repo.git"
                    autocomplete="off" />
            </div>

            <button id="commit-btn" class="glow-on-hover">
                <span id="btn-text">Make Contribution</span>
                <div id="spinner" class="spinner hidden"></div>
            </button>

            <div id="status-message" class="status-message hidden">
                Success! Your contribution was pushed.
            </div>
        </div>
    </div>

    <script>
        const btn = document.getElementById('commit-btn');
        const btnText = document.getElementById('btn-text');
        const spinner = document.getElementById('spinner');
        const statusMsg = document.getElementById('status-message');
        const repoInput = document.getElementById('repo-url');
        const dailyCountDisplay = document.getElementById('daily-count');

        // Fetch initial stats on page load
        async function loadStats() {
            try {
                const res = await fetch('/api/stats');
                if (res.ok) {
                    const stats = await res.json();
                    dailyCountDisplay.textContent = stats.count;
                }
            } catch (err) {
                console.error("Failed to load stats", err);
            }
        }

        loadStats();

        btn.addEventListener('click', async () => {
            const repoUrl = repoInput.value.trim();
            if (!repoUrl) {
                statusMsg.textContent = "Please enter a repository URL.";
                statusMsg.classList.remove('hidden', 'success');
                statusMsg.classList.add('error');
                return;
            }

            btn.disabled = true;
            btnText.textContent = "Committing...";
            spinner.classList.remove('hidden');
            statusMsg.classList.add('hidden');
            statusMsg.classList.remove('success', 'error');

            try {
                const response = await fetch('/api/commit', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ repoUrl })
                });

                if (response.ok) {
                    const data = await response.json();
                    statusMsg.textContent = "Success! Your contribution was pushed.";
                    statusMsg.classList.add('success');

                    // Update the counter on screen
                    if (data.count !== undefined) {
                        dailyCountDisplay.textContent = data.count;
                    }
                } else {
                    const data = await response.json();
                    statusMsg.textContent = "Error: " + (data.error || "Failed to commit.");
                    statusMsg.classList.add('error');
                }
            } catch (err) {
                statusMsg.textContent = "Network error. Make sure the server is running.";
                statusMsg.classList.add('error');
            } finally {
                btn.disabled = false;
                btnText.textContent = "Make Contribution";
                spinner.classList.add('hidden');
                statusMsg.classList.remove('hidden');
            }
        });
    </script>
</body>

</html>
